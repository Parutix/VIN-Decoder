version: "3.9"

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: vin_decoder_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./BACKEND
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: userpass
      DB_NAME: vin_decoder_db
      JWT_SECRET: yourSecretKey
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./FRONTEND
    ports:
      - "8080:80"

volumes:
  db_data:
